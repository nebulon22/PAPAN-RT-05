<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111827; z-index: 9999; display: flex; flex-direction: column;

    }
    .login-box {
      background: white; color: #111; padding: 30px 24px; border-radius: 16px;

    }
    .login-box h2 { margin: 0 0 8px 0; font-size: 20px; }
    .login-box p.subtitle { font-size: 12px; color: #666; margin: 0 0 20px 0; }

      width: 100%; padding: 12px; margin-bottom: 16px; border: 2px solid #ddd;

    .btn-rute { background-color: #00c853; color: white !important; }
    .btn-edit { background-color: #ff9800; color: white !important; margin-top: 4px; }
    
    .custom-pin { background: none; border: none; }
    .img-popup { width: 100%; max-height: 140px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid #ddd; }

    #top-panel {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000;
      width: 86%; max-width: 340px; display: flex; flex-direction: column; gap: 10px;
    }
    #search-box { background: white; padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; gap: 6px; }
    #searchInput { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
    #search-box button { padding: 8px 12px; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .filter-container { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .filter-row { display: flex; gap: 6px; width: 100%; justify-content: center; }
    .filter-row:nth-child(2) { max-width: 90%; margin: 0 auto; }
    .btn-filter {
      flex: 1; justify-content: center; padding: 6px 8px; background: white; color: #333;
      border: 1px solid #ccc; border-radius: 20px; font-size: 11.5px; font-weight: bold;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .btn-filter.active { background: #00c853; color: white; border-color: #00c853; }

    .modal-bg {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); z-index: 2000;
  align-items: center; justify-content: center;
  padding: 20px 10px; box-sizing: border-box; /* Memberi jarak aman atas & bawah layar */
}
.modal-content {
  background: white; width: 90%; max-width: 400px; border-radius: 12px; padding: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column;
  max-height: 80vh; overflow-y: auto; /* Membatasi tinggi agar tombol X dan header selalu muat */
  margin: auto;
}
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
    .modal-header h3 { margin: 0; font-size: 16px; color: #111; }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #777; font-weight: bold; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .btn-submit { background: #00c853; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; }

    .btn-admin-act { background: #111827; color: #ffffff; border: 1px solid #111827; }
    .btn-admin-act:hover { background: #374151; }

    /* Styling khusus tombol Laporan Divisi (Warna Ungu) */
.btn-purple {
  background: #8b5cf6 !important;
  color: white !important;
  border-color: #7c3aed !important;
}
.btn-purple:hover {
  background: #7c3aed !important;
}
  
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🔒 Akses Admin</h2>
      <p class="subtitle">Masukkan 6 Digit PIN Pengurus</p>
      <input type="password" id="adminPin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" onkeypress="if(event.key === 'Enter') cekLogin()">
      <button onclick="cekLogin()">Buka Kunci</button>

  <a href="index.html" class="btn-back-floating">⬅️ Mode Warga</a>
  <div id="map"></div>

 <div id="top-panel">
    <div id="search-box">
      <input type="text" id="searchInput" placeholder="Cari nama atau No Rumah...">
      <button onclick="cariLokasi()">Cari</button>

   <div class="filter-container">
      <div class="filter-row">
        <button class="btn-filter active" onclick="filterKategori('semua', this)">🌍 Semua</button>

<button type="button" onclick="bukaModalPinjamAdmin()" style="background: #8b5cf6; color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

        <a href="https://forms.gle/vpfvQAwNqtJyKW6Q6" target="_blank" style="flex: 1; text-decoration: none; display: flex;">

<div id="modal-form" class="modal-bg" onclick="event.stopPropagation(); if(event.target === this) tutupModalForm();">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="formTitle">📍 Tambah Data Baru</h3>
        <button class="close-btn" onclick="tutupModalForm()">&times;</button>
      </div>
      <form id="dataForm">
        <input type="hidden" name="pin" id="inputPinForm">
        
        <div class="form-group"><label>Nama / No. Rumah / Tempat:</label><input type="text" name="nama" id="inputNama" required></div>

          <div class="form-group" style="flex: 1;"><label>Latitude:</label><input type="text" name="lat" id="inputLat" required></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwfw0-V4hiZNnqwmDCLQMhOhZgWKpuGhDh1Rasb7PlswuJtNOqyHJJwSWFdpvIo7ET7aw/exec";

    document.addEventListener("DOMContentLoaded", () => {
      if(sessionStorage.getItem('authAdmin') === 'true') {
        bukaAkses();
      }
    });

  function cekLogin() {
      const input = document.getElementById('adminPin').value.trim();
      if(input.length !== 6) {
        alert("PIN harus berisi 6 digit angka!");
        return;
      }

      const btnLogin = document.querySelector('.login-box button');
      btnLogin.innerText = "⏳ Memeriksa...";
      btnLogin.disabled = true;

      // Kirim tes simpan data kosong hanya untuk memverifikasi PIN ke Apps Script
      const payloadTes = {
        action: 'cek_pin', // 👈 Tambahkan ini
        pin: input,
        nama: '',
        lat: '',
        lng: '',
        kategori: '',
        hidden: '',
        foto: ''
      };

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payloadTes)
      })
      .then(res => res.text())
      .then(result => {
        btnLogin.innerText = "Buka Kunci";
        btnLogin.disabled = false;

        // Jika balasan dari server BUKAN "ERROR: PIN Admin Salah!"
        if (!result.includes("PIN Admin Salah")) {
          sessionStorage.setItem('authAdmin', 'true');
          sessionStorage.setItem('verifiedPin', input);
          bukaAkses();
        } else {
          alert("❌ PIN salah! Akses ditolak.");
          document.getElementById('adminPin').value = "";
        }
      })
      .catch(err => {
        btnLogin.innerText = "Buka Kunci";
        btnLogin.disabled = false;
        alert("❌ Error koneksi: " + err);
      });
    }

    function bukaAkses() {
      document.getElementById('login-overlay').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
      initMap(); 
      setTimeout(() => { if(map) map.invalidateSize(); }, 300);
    }

    document.getElementById('dataForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitForm');
      btn.innerText = '⏳ Menyimpan...';
      btn.disabled = true;

      const payload = {
        pin: document.getElementById('inputPinForm').value,
        nama: document.getElementById('inputNama').value,
        lat: document.getElementById('inputLat').value,
        lng: document.getElementById('inputLng').value,
        kategori: document.getElementById('inputKategori').value,
        hidden: document.getElementById('inputHidden').value,
        foto: document.getElementById('inputFoto').value
      };

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.text())
      .then(result => {
        btn.innerText = '💾 Simpan ke Google Sheet';
        btn.disabled = false;
        if(result.includes('SUCCESS')) {
          alert('✅ Data berhasil disimpan!');
          tutupModalForm();
          location.reload();
        } else {
          alert('❌ Gagal: ' + result);
          
          // Jika server menolak karena PIN salah, otomatis reset login
          if(result.toLowerCase().includes('pin')) {
            sessionStorage.removeItem('authAdmin');
            sessionStorage.removeItem('verifiedPin');
            location.reload();
          }
        }
      })
      .catch(err => {
        btn.innerText = '💾 Simpan ke Google Sheet';
        btn.disabled = false;
        alert('❌ Error koneksi: ' + err);
      });
    });

    var map, daftarPin = [], pinRumahAktif = null;
    var SHEET_ID = '1zk_ZhczenW5-sZ7B_jvLpzAXEKeyJcxHCTd_qiqbW3Y'; 
    var SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    function initMap() {
      map = L.map('map').setView([-7.7423, 110.3842], 17);
      L.DomEvent.disableClickPropagation(document.getElementById('modal-form'));
      L.DomEvent.disableClickPropagation(document.getElementById('modal-admin-inventaris'));
      L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);

      var batasRT05 = [
        [-7.7441031, 110.3835], [-7.7447197, 110.3852273], [-7.743848, 110.3854633],
        [-7.7440818, 110.3861822], [-7.742955, 110.3864933], [-7.7428593, 110.3858925],
        [-7.7407331, 110.3866972], [-7.7404886, 110.3861929], [-7.740563, 110.3848089],
        [-7.7399995, 110.3831674], [-7.740159, 110.382234], [-7.7414879, 110.3818906],
        [-7.7421789, 110.3819979], [-7.7428699, 110.3838755], [-7.7441031, 110.3835]
      ];
      L.polygon(batasRT05, { color: '#00c853', weight: 3, fillColor: '#00c853', fillOpacity: 0.1 }).addTo(map);

     map.on('click', function(e) {
  // 🟢 BARIS TAMBAHAN: Jika modal sedang terbuka, abaikan klik di peta
if (document.getElementById('modal-form').style.display === 'flex' || document.getElementById('modal-admin-inventaris').style.display === 'flex') return;
  document.getElementById('formTitle').innerText = "📍 Tambah Data Baru";
  document.getElementById('inputNama').value = "";
  document.getElementById('inputLat').value = e.latlng.lat.toFixed(6);
  document.getElementById('inputLng').value = e.latlng.lng.toFixed(6);
  document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
  document.getElementById('inputFoto').value = "";
  document.getElementById('modal-form').style.display = 'flex';
});

          fetch(SHEET_URL)
      .then(response => response.text())
      .then(csvText => {
        var baris = parseCSV(csvText).slice(1);

        baris.forEach(function(kolom) {
          if (kolom.length >= 3 && kolom[0] !== '') {
            var latClean = perbaikiKoordinat(kolom[1]);
            var lngClean = perbaikiKoordinat(kolom[2]);
            var statusHidden = kolom[3] ? kolom[3].trim().toUpperCase() === 'TRUE' : false;
            var kategoriManual = kolom[4] ? kolom[4].trim().toLowerCase() : '';
            var urlFoto = kolom[5] ? kolom[5].trim() : '';

            var namaAsli = kolom[0].trim();
            var namaTampil = namaAsli;

            var item = {
              name: namaTampil,
              nameAsli: namaAsli,
              lat: parseFloat(latClean),
              lng: parseFloat(lngClean),
              hidden: statusHidden,
              foto: urlFoto
            };

            if (isNaN(item.lat) || isNaN(item.lng)) return;

            var urlRute = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;
            var htmlFoto = item.foto ? `<br><img src="${item.foto}" class="img-popup" alt="Foto Depan" onclick="bukaFotoBesar('${item.foto}', event)" onError="this.style.display='none'">` : '';
            var popupContent = `<b>${item.name}</b>${htmlFoto}<br><a href="${urlRute}" target="_blank" class="btn-rute">📍 Rute ke Sini</a>`;
            
            let emoji = '🏠'; 
            let kategori = 'rumah';
            let namaUpper = item.nameAsli.toUpperCase();

            let bgStyle = 'background: #000000; border: 2px solid #00FF66; color: black; width: 22px; height: 22px; font-size: 12px;';

            if (kategoriManual.includes('kuliner') || namaUpper.includes('COFFEE') || namaUpper.includes('CAFE') || namaUpper.includes('KEDAI') || namaUpper.includes('WARUNG') || namaUpper.includes('BAKSO') || namaUpper.includes('AYAM') || namaUpper.includes('SOTO')) {
              kategori = 'kuliner'; emoji = '🍽️';
              bgStyle = 'background: #FFA500; border: 2px solid #FFFFFF; color: black; width: 22px; height: 22px; font-size: 12px;';
            } 
            else if (kategoriManual.includes('minimarket') || kategoriManual.includes('toko') || namaUpper.includes('MART') || namaUpper.includes('TOKO') || namaUpper.includes('LAUNDRY')) {
              kategori = 'minimarket'; emoji = '🏪';
              bgStyle = 'background: #FFFF00; border: 2px solid #FFEA00; color: black; width: 22px; height: 22px; font-size: 12px;';
            } 
            else if (kategoriManual.includes('kost') || kategoriManual.includes('kos') || namaUpper.includes('KOST') || namaUpper.includes('KOS') || namaUpper.includes('KONTRAKAN') || namaUpper.includes('WISMA')) {
              kategori = 'kost'; emoji = '🛏️';
              bgStyle = 'background: #f3e8ff; border: 2px solid #a855f7; color: black; width: 22px; height: 22px; font-size: 12px;';
            }
            else if (kategoriManual.includes('fasum') || kategoriManual.includes('umum') || namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || namaUpper.includes('LAPANGAN') || namaUpper.includes('BALAI') || namaUpper.includes('SPORT')) {
              kategori = 'fasum'; emoji = '🏛️';
              bgStyle = 'background: white; border: 2px solid #ef4444; color: black; width: 22px; height: 22px; font-size: 12px;';
              
              if (namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || kategoriManual.includes('masjid')) {
                emoji = '🕌';
                bgStyle = 'background-color: #0d9488; color: white; border: 2px solid white; width: 28px; height: 28px; font-size: 14px;';
              } else if (namaUpper.includes('LAPANGAN') || namaUpper.includes('SPORT') || namaUpper.includes('BASKETBALL')) {
                emoji = '🏀';
              }
            }

            var customIcon = L.divIcon({
              className: 'custom-pin',
              html: `<div style="${bgStyle} border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 10px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.2);">${emoji}</div>`,
              iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
            });
            
            var marker = L.marker([item.lat, item.lng], { icon: customIcon }).bindPopup(popupContent, { maxWidth: 220 });
            if (!item.hidden) marker.addTo(map);

            daftarPin.push({ 
              namaRaw: item.nameAsli,
              nama: item.nameAsli.toLowerCase(), 
              marker: marker, 
              lat: item.lat, 
              lng: item.lng,
              hidden: item.hidden,
              kategori: kategori 
            });
          }
        });
      })
      .catch(error => console.error(error));
    }
      
    function parseCSV(text) {
      var lines = text.replace(/\r/g, '').split('\n'); var result = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim(); if (!line) continue;
        var row = []; var inQuotes = false; var cur = '';
        for (var c = 0; c < line.length; c++) {
          var char = line[c];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
          else cur += char;
        }
        row.push(cur.trim().replace(/^"|"$/g, '')); result.push(row);
      } return result;
    }
      
    function perbaikiKoordinat(val) {
      if (!val) return "";
      var str = val.toString().replace(/,/g, '.').replace(/\s+/g, '');
      var isNegatif = str.startsWith('-');
      str = str.replace(/-/g, '').replace(/\./g, '');
      
      if (str.length > 2) {
        if (isNegatif && str.startsWith('7')) {
          str = '-7.' + str.substring(1);
        } else if (!isNegatif && str.startsWith('110')) {
          str = '110.' + str.substring(3);
        } else {
          str = (isNegatif ? '-' : '') + str.substring(0, 1) + '.' + str.substring(1);
        }
      }
      return str;
    }

    

    
    function tutupModalForm() { document.getElementById('modal-form').style.display = 'none'; }
      
    window.editDataByIdx = function(idx) {
      var item = daftarPin[idx];
      if (!item) return;

      document.getElementById('formTitle').innerText = "✏️ Edit: " + item.namaRaw;
      document.getElementById('inputNama').value = item.namaRaw; 
      document.getElementById('inputLat').value = item.lat; 
      document.getElementById('inputLng').value = item.lng;
      document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
      
      var formK = document.getElementById('inputKategori');
      if (item.kategori === 'kuliner') formK.value = 'Kuliner'; 
      else if (item.kategori === 'kost') formK.value = 'Kost'; 
      else if (item.kategori === 'fasum') formK.value = 'Fasum'; 
      else if (item.kategori === 'minimarket') formK.value = 'Minimarket'; 
      else formK.value = 'Rumah';

      document.getElementById('inputHidden').value = item.hidden ? 'TRUE' : 'FALSE'; 
      document.getElementById('inputFoto').value = item.foto || '';
      document.getElementById('modal-form').style.display = 'flex';
    };

    function filterKategori(kat, btnElement) {
  // Otomatis ambil tombol yang diklik
  var btn = btnElement || (window.event ? window.event.currentTarget : null);

  // 1. Lepas warna hijau dari semua tombol
  document.querySelectorAll('.btn-filter').forEach(function(b) {
    b.classList.remove('active');
  });

  // 2. Pasang warna hijau ke tombol yang baru diklik
  if (btn && btn.classList) {
    btn.classList.add('active');
  }

  // 3. Tampilkan pin sesuai kategori
  daftarPin.forEach(function(pin) {
    map.removeLayer(pin.marker);
    if (!pin.hidden) {
      if (kat === 'semua' || pin.kategori === kat) {
        pin.marker.addTo(map);
      }
    }
  });
}

    function cariLokasi() {
      var kataKunci = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!kataKunci) return;

      var hasil = daftarPin.find(pin => pin.namaRaw.toLowerCase() === kataKunci);

      if (!hasil && /^\d+$/.test(kataKunci)) {
        var angkaCari = parseInt(kataKunci, 10);
        hasil = daftarPin.find(pin => {
          var kataKata = pin.nama.split(/[\s,().-]+/);
          return kataKata.some(kata => /^\d+$/.test(kata) && parseInt(kata, 10) === angkaCari);
        });
      }

      if (!hasil && !/^\d+$/.test(kataKunci)) {
        hasil = daftarPin.find(pin => pin.nama.includes(kataKunci));
      }

      if (hasil) {
        if (pinRumahAktif) map.removeLayer(pinRumahAktif);
        if (!map.hasLayer(hasil.marker)) { hasil.marker.addTo(map); pinRumahAktif = hasil.marker; }
        map.flyTo([hasil.lat, hasil.lng], 19); setTimeout(() => { hasil.marker.openPopup(); }, 800);
      } else alert("Lokasi atau nomor rumah tidak ditemukan.");
    }


// 1. Fungsi Buka & Tutup Modal (BARU)
function bukaModalPinjamAdmin() {
  muatPeminjamanAdmin(); // Ambil data terbaru dari Google Sheets saat modal dibuka
  document.getElementById("modal-admin-inventaris").style.display = "flex";
}

function tutupModalPinjamAdmin() {
  document.getElementById("modal-admin-inventaris").style.display = "none";
}

// 2. Ambil Data Peminjaman dari Google Sheets (TETAP DIPAKAI)
async function muatPeminjamanAdmin() {
  const container = document.getElementById("tabel-peminjaman-admin");
  if (!container) return;

  container.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:12px;">⏳ Memuat data...</td></tr>`;

  try {
    const res = await fetch(GAS_WEB_APP_URL);
    const data = await res.json();
    
    // 1. Ambil array peminjaman dari respon JSON
    const daftarPinjam = Array.isArray(data) ? data : (data.peminjaman || []);

    // 2. Isi dropdown 'Pilih Barang' secara otomatis dari tab Perkakas
    const selectBarang = document.getElementById("pinjamPilihBarang");
    if (selectBarang && data.perkakas && data.perkakas.length > 0) {
      selectBarang.innerHTML = `<option value="">-- Pilih Barang --</option>` + 
        data.perkakas.map(item => `<option value="${item.nama}">${item.nama} (Stok: ${item.total})</option>`).join('');
    }
    
    // 3. Filter transaksi yang statusnya 'Dipinjam' (kolom index 5)
    const pinjamanAktif = daftarPinjam.filter(row => row[5] === "Dipinjam");

    if (pinjamanAktif.length === 0) {
      container.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:12px; color:#888;">Tidak ada barang yang sedang dipinjam.</td></tr>`;
      return;
    }

    container.innerHTML = pinjamanAktif.map(row => `
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 6px; font-weight: bold;">${row[1]}</td>
        <td style="padding: 6px;">${row[2]}</td>
        <td style="padding: 6px; text-align: center; font-weight: bold;">${row[3]}</td>
        <td style="padding: 6px; text-align: center;">
          <button onclick="prosesPengembalian('${row[0]}')" style="background: #0288d1; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10.5px; font-weight: bold;">
            ↩️ Dikembalikan
          </button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    console.error("Error muatPeminjamanAdmin:", err);
    container.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red; padding:12px;">Gagal memuat data.</td></tr>`;
  }
}

// 3. Simpan Pinjam Baru ke Google Sheets (TETAP DIPAKAI)
async function simpanPeminjamanAdmin() {
  const peminjam = document.getElementById("pinjamNamaWarga").value;
  const barang = document.getElementById("pinjamPilihBarang").value;
  const jumlah = document.getElementById("pinjamJumlah").value;
  const pinAdmin = sessionStorage.getItem('verifiedPin') || '';

  if (!peminjam || !barang || !jumlah) {
    alert("Mohon lengkapi semua data!");
    return;
  }

  const btn = document.querySelector("#modal-admin-inventaris button[onclick*='simpanPeminjamanAdmin']");
  if(btn) { btn.innerText = "⏳ Menyimpan..."; btn.disabled = true; }

  const hariIni = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  const payload = {
    pin: pinAdmin, // PIN wajib dikirim agar lolos verifikasi GAS
    action: "pinjam",
    id: "ID-" + Date.now(),
    peminjam: peminjam,
    barang: barang,
    jumlah: parseInt(jumlah),
    tgl: hariIni
  };

  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();

    if (btn) { btn.innerText = "➕ Catat Pinjam"; btn.disabled = false; }

    if (text.includes("SUCCESS")) {
      alert("✅ Peminjaman berhasil dicatat!");
      document.getElementById("pinjamNamaWarga").value = "";
      document.getElementById("pinjamPilihBarang").value = "";
      document.getElementById("pinjamJumlah").value = "";
      muatPeminjamanAdmin(); // Reload daftar peminjam di pop-up
    } else {
      alert("❌ Gagal menyimpan: " + text);
    }
  } catch (err) {
    if (btn) { btn.innerText = "➕ Catat Pinjam"; btn.disabled = false; }
    alert("❌ Error koneksi: " + err);
  }
}

async function prosesPengembalian(id) {
  if (confirm("Apakah barang ini sudah dikembalikan?")) {
    const pinAdmin = sessionStorage.getItem('verifiedPin') || '';
    
    try {
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          pin: pinAdmin, // PIN wajib dikirim
          action: "kembali",
          id: id
        })
      });
      const text = await res.text();

      if (text.includes("SUCCESS")) {
        alert("✅ Status barang berhasil diperbarui!");
        muatPeminjamanAdmin();
      } else {
        alert("❌ Gagal memperbarui: " + text);
      }
    } catch (err) {
      alert("❌ Error koneksi: " + err);
    }
  }
}
