<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Denah & Keuangan RT 05</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; }
    
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111827; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: white;
    }
    .login-box {
      background: white; color: #111; padding: 30px 24px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 80%; max-width: 320px;
    }
    .login-box h2 { margin: 0 0 8px 0; font-size: 20px; }
    .login-box p.subtitle { font-size: 12px; color: #666; margin: 0 0 20px 0; }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 16px; border: 2px solid #ddd;
      border-radius: 8px; box-sizing: border-box; font-size: 24px; text-align: center;
      letter-spacing: 12px; font-family: monospace; outline: none; transition: border 0.3s;
    }
    .login-box input:focus { border-color: #0288d1; }
    .login-box button {
      width: 100%; background: #0288d1; color: white; padding: 12px;
      border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    .login-box button:hover { background: #0277bd; }

    .btn-back-floating {
      position: absolute; top: 12px; right: 12px; z-index: 1001; background: #d32f2f;
      color: #fff !important; padding: 8px 14px; border-radius: 20px; text-decoration: none;
      font-size: 12px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex; align-items: center; gap: 4px;
    }

    .btn-rute, .btn-edit {
      display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 4px;
      font-size: 12px; font-weight: bold; text-align: center; text-decoration: none;
      border: none; cursor: pointer; width: 100%; box-sizing: border-box;
    }
    .btn-rute { background-color: #00c853; color: white !important; }
    .btn-edit { background-color: #ff9800; color: white !important; margin-top: 4px; }
    
    .custom-pin { background: none; border: none; }
    .img-popup { width: 100%; max-height: 140px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid #ddd; }

    #top-panel {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000;
      width: 86%; max-width: 340px; display: flex; flex-direction: column; gap: 10px;
    }
    #search-box { background: white; padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; gap: 6px; }
    #searchInput { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
    #search-box button { padding: 8px 12px; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .filter-container { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .filter-row { display: flex; gap: 6px; width: 100%; justify-content: center; }
    .filter-row:nth-child(2) { max-width: 90%; margin: 0 auto; }
    .btn-filter {
      flex: 1; justify-content: center; padding: 6px 8px; background: white; color: #333;
      border: 1px solid #ccc; border-radius: 20px; font-size: 11.5px; font-weight: bold;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .btn-filter.active { background: #00c853; color: white; border-color: #00c853; }

    .modal-bg {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;
    }
    .modal-content {
      background: white; width: 90%; max-width: 400px; border-radius: 12px; padding: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
    .modal-header h3 { margin: 0; font-size: 16px; color: #111; }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #777; font-weight: bold; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    .btn-submit { background: #00c853; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; }

    .fab-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1500; display: flex;
      flex-direction: column-reverse; align-items: flex-end; gap: 10px;
    }
    .fab-menu { display: none; flex-direction: column; align-items: flex-end; gap: 10px; margin-bottom: 10px; }
    .fab-container:hover .fab-menu, .fab-container.active .fab-menu { display: flex; }
    .fab-main {
      width: 56px; height: 56px; border-radius: 50%; background: #111827; color: white;
      font-size: 24px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.3s;
    }
    .fab-main:hover { background: #374151; }
    .fab-item {
      background: white; color: #111; border: 1px solid #ccc; padding: 8px 16px;
      border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>🔒 Akses Admin</h2>
      <p class="subtitle">Masukkan 6 Digit PIN Pengurus</p>
      <input type="password" id="adminPin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" onkeypress="if(event.key === 'Enter') cekLogin()">
      <button onclick="cekLogin()">Buka Kunci</button>
    </div>
  </div>

  <a href="index.html" class="btn-back-floating">⬅️ Mode Warga</a>
  <div id="map"></div>

 <div id="top-panel">
    <div id="search-box">
      <input type="text" id="searchInput" placeholder="Cari nama atau No Rumah...">
      <button onclick="cariLokasi()">Cari</button>
    </div>
    <div class="filter-container">
      <div class="filter-row">
        <button class="btn-filter active" onclick="filterKategori('semua', this)">🌍 Semua</button>
        <button class="btn-filter" onclick="filterKategori('kost', this)">🛏️ Kost</button>
        <button class="btn-filter" onclick="filterKategori('fasum', this)">🏛️ Fasum</button>
      </div>
      <div class="filter-row">
        <button class="btn-filter" onclick="filterKategori('kuliner', this)">🍽️ Kuliner</button>
        <button class="btn-filter" onclick="filterKategori('minimarket', this)">🏪 Minimarket</button>
      </div>
    </div>
  </div>

  
<div class="fab-container" id="fabContainer">
  <button class="fab-main" onclick="toggleFab()">⚙️</button>
  <div class="fab-menu">
    <button class="fab-item" onclick="bukaModalFormPin()">📍 Tambah / Edit Tempat</button>
    
    <!-- Menu Google Form Keuangan -->
    <a href="https://forms.gle/vpfvQAwNqtJyKW6Q6" target="_blank" style="text-decoration:none;">
      <button class="fab-item">📝 Form Input Keuangan</button>
    </a>

    <a href="https://docs.google.com/spreadsheets/d/1zk_ZhczenW5-sZ7B_jvLpzAXEKeyJcxHCTd_qiqbW3Y/edit" target="_blank" style="text-decoration:none;">
      <button class="fab-item">💰 Edit Keuangan</button>
    </a>
    <a href="https://docs.google.com/spreadsheets/d/1zk_ZhczenW5-sZ7B_jvLpzAXEKeyJcxHCTd_qiqbW3Y/edit" target="_blank" style="text-decoration:none;">
      <button class="fab-item">📢 Edit Pengumuman</button>
    </a>
  </div>
</div>

  <div id="modal-form" class="modal-bg">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="formTitle">📍 Tambah Data Baru</h3>
        <button class="close-btn" onclick="tutupModalForm()">&times;</button>
      </div>
      <form id="dataForm">
        <input type="hidden" name="pin" id="inputPinForm">
        
        <div class="form-group"><label>Nama / No. Rumah / Tempat:</label><input type="text" name="nama" id="inputNama" required></div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;"><label>Latitude:</label><input type="text" name="lat" id="inputLat" required></div>
          <div class="form-group" style="flex: 1;"><label>Longitude:</label><input type="text" name="lng" id="inputLng" required></div>
        </div>
        <div class="form-group">
          <label>Kategori:</label>
          <select name="kategori" id="inputKategori">
            <option value="Rumah">🏠 Rumah</option>
            <option value="Kost">🛏️ Kost</option>
            <option value="Fasum">🏛️ Fasum</option>
            <option value="Kuliner">🍽️ Kuliner</option>
            <option value="Minimarket">🏪 Minimarket</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sembunyikan dari Peta?</label>
          <select name="hidden" id="inputHidden"><option value="FALSE">Tidak (Tampil)</option><option value="TRUE">Ya (Sembunyikan)</option></select>
        </div>
        <div class="form-group"><label>URL Foto Depan (Opsional):</label><input type="url" name="foto" id="inputFoto"></div>
        <button type="submit" class="btn-submit" id="btnSubmitForm">💾 Simpan ke Google Sheet</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbygqnBkpRRLFLr1AyW5Si5R9tjOb9l4fUm0Yv2Cpq3kQln98R9ktEgzF1VgQofn4pTWxw/exec';

    document.addEventListener("DOMContentLoaded", () => {
      if(sessionStorage.getItem('authAdmin') === 'true') {
        bukaAkses();
      }
    });

    function cekLogin() {
      const input = document.getElementById('adminPin').value.trim();
      if(input.length !== 6) {
        alert("PIN harus berisi 6 digit angka!");
        return;
      }
      
      if (input === "050505") {
        sessionStorage.setItem('authAdmin', 'true');
        sessionStorage.setItem('verifiedPin', input);
        bukaAkses();
      } else {
        alert("PIN salah! Akses ditolak.");
        document.getElementById('adminPin').value = "";
      }
    }

    function bukaAkses() {
      document.getElementById('login-overlay').style.display = 'none';
      document.body.style.overflow = 'auto';
      document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
      initMap(); 
      setTimeout(() => { if(map) map.invalidateSize(); }, 300);
    }

    document.getElementById('dataForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitForm');
      btn.innerText = '⏳ Menyimpan...';
      btn.disabled = true;

      const payload = {
        pin: document.getElementById('inputPinForm').value,
        nama: document.getElementById('inputNama').value,
        lat: document.getElementById('inputLat').value,
        lng: document.getElementById('inputLng').value,
        kategori: document.getElementById('inputKategori').value,
        hidden: document.getElementById('inputHidden').value,
        foto: document.getElementById('inputFoto').value
      };

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.text())
      .then(result => {
        btn.innerText = '💾 Simpan ke Google Sheet';
        btn.disabled = false;
        if(result.includes('SUCCESS')) {
          alert('✅ Data berhasil disimpan!');
          tutupModalForm();
          location.reload();
        } else {
          alert('❌ Gagal dari server: ' + result);
        }
      })
      .catch(err => {
        btn.innerText = '💾 Simpan ke Google Sheet';
        btn.disabled = false;
        alert('❌ Error koneksi: ' + err);
      });
    });

    var map, daftarPin = [], pinRumahAktif = null;
    var SHEET_ID = '1zk_ZhczenW5-sZ7B_jvLpzAXEKeyJcxHCTd_qiqbW3Y'; 
    var SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    function initMap() {
      map = L.map('map').setView([-7.7423, 110.3842], 17);
      L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);

      var batasRT05 = [
        [-7.7441031, 110.3835], [-7.7447197, 110.3852273], [-7.743848, 110.3854633],
        [-7.7440818, 110.3861822], [-7.742955, 110.3864933], [-7.7428593, 110.3858925],
        [-7.7407331, 110.3866972], [-7.7404886, 110.3861929], [-7.740563, 110.3848089],
        [-7.7399995, 110.3831674], [-7.740159, 110.382234], [-7.7414879, 110.3818906],
        [-7.7421789, 110.3819979], [-7.7428699, 110.3838755], [-7.7441031, 110.3835]
      ];
      L.polygon(batasRT05, { color: '#00c853', weight: 3, fillColor: '#00c853', fillOpacity: 0.1 }).addTo(map);

      map.on('click', function(e) {
        document.getElementById('formTitle').innerText = "📍 Tambah Data Baru";
        document.getElementById('inputNama').value = "";
        document.getElementById('inputLat').value = e.latlng.lat.toFixed(6);
        document.getElementById('inputLng').value = e.latlng.lng.toFixed(6);
        document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
        document.getElementById('modal-form').style.display = 'flex';
      });

      fetch(SHEET_URL).then(res => res.text()).then(csv => {
        var baris = parseCSV(csv).slice(1);

        baris.forEach(function(kolom) {
          if (kolom.length >= 3 && kolom[0] !== '') {
            var latClean = perbaikiKoordinat(kolom || '');
            var lngClean = perbaikiKoordinat(kolom || '');
            var parsedLat = parseFloat(latClean);
            var parsedLng = parseFloat(lngClean);
            if (isNaN(parsedLat) || isNaN(parsedLng)) return;

            var kategoriManual = kolom[3] ? kolom[3].trim().toLowerCase() : '';
            var statusHidden = kolom[4] ? kolom[4].trim().toUpperCase() === 'TRUE' : false;
            var urlFoto = kolom[5] ? kolom[5].trim() : '';

            var namaAsli = kolom[0].trim();
            var namaUpper = namaAsli.toUpperCase();

            let emoji = '🏠'; 
            let kategori = 'rumah';
            let bgStyle = 'background: #000000; border: 2px solid #00FF66; color: black; width: 22px; height: 22px; font-size: 12px;';

            if (kategoriManual.includes('kuliner') || namaUpper.includes('COFFEE') || namaUpper.includes('CAFE') || namaUpper.includes('KEDAI') || namaUpper.includes('WARUNG') || namaUpper.includes('BAKSO') || namaUpper.includes('AYAM') || namaUpper.includes('SOTO')) {
              kategori = 'kuliner'; emoji = '🍽️';
              bgStyle = 'background: #FFA500; border: 2px solid #FFFFFF; color: black; width: 22px; height: 22px; font-size: 12px;';
            } 
            else if (kategoriManual.includes('minimarket') || kategoriManual.includes('toko') || namaUpper.includes('MART') || namaUpper.includes('TOKO') || namaUpper.includes('LAUNDRY')) {
              kategori = 'minimarket'; emoji = '🏪';
              bgStyle = 'background: #FFFF00; border: 2px solid #FFEA00; color: black; width: 22px; height: 22px; font-size: 12px;';
            } 
            else if (kategoriManual.includes('kost') || kategoriManual.includes('kos') || namaUpper.includes('KOST') || namaUpper.includes('KOS') || namaUpper.includes('KONTRAKAN') || namaUpper.includes('WISMA')) {
              kategori = 'kost'; emoji = '🛏️';
              bgStyle = 'background: #f3e8ff; border: 2px solid #a855f7; color: black; width: 22px; height: 22px; font-size: 12px;';
            }
            else if (kategoriManual.includes('fasum') || kategoriManual.includes('umum') || namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || namaUpper.includes('LAPANGAN') || namaUpper.includes('BALAI') || namaUpper.includes('SPORT')) {
              kategori = 'fasum'; emoji = '🏛️';
              bgStyle = 'background: white; border: 2px solid #ef4444; color: black; width: 22px; height: 22px; font-size: 12px;';
              
              if (namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || kategoriManual.includes('masjid')) {
                emoji = '🕌';
                bgStyle = 'background-color: #0d9488; color: white; border: 2px solid white; width: 28px; height: 28px; font-size: 14px;';
              } else if (namaUpper.includes('LAPANGAN') || namaUpper.includes('SPORT') || namaUpper.includes('BASKETBALL')) {
                emoji = '🏀';
              }
            }

            var htmlFoto = urlFoto ? `<img src="${urlFoto}" class="img-popup">` : '';
            var popupContent = `<b>${namaAsli}</b>${htmlFoto}<br><button class="btn-edit" onclick="editData('${escapeHtml(namaAsli)}', ${parsedLat}, ${parsedLng}, '${kategori}', ${statusHidden}, '${urlFoto}')">✏️ Edit Data Ini</button>`;

            var customIcon = L.divIcon({
              className: 'custom-pin',
              html: `<div style="${bgStyle} border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 10px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.2);">${emoji}</div>`,
              iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
            });

            var marker = L.marker([parsedLat, parsedLng], { icon: customIcon }).bindPopup(popupContent, { maxWidth: 220 });
            if (!statusHidden) marker.addTo(map);

            daftarPin.push({ namaRaw: namaAsli, nama: namaAsli.toLowerCase(), marker: marker, lat: parsedLat, lng: parsedLng, hidden: statusHidden, kategori: kategori });
          }
        });
      });
    }
      
    function parseCSV(text) {
      var lines = text.replace(/\r/g, '').split('\n'); var result = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim(); if (!line) continue;
        var row = []; var inQuotes = false; var cur = '';
        for (var c = 0; c < line.length; c++) {
          var char = line[c];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
          else cur += char;
        }
        row.push(cur.trim().replace(/^"|"$/g, '')); result.push(row);
      } return result;
    }
      
    function perbaikiKoordinat(val) {
      if (!val) return "";
      var str = val.toString().replace(/,/g, '.').replace(/\s+/g, '');
      var isNegatif = str.startsWith('-');
      str = str.replace(/-/g, '').replace(/\./g, '');
      
      if (str.length > 2) {
        if (isNegatif && str.startsWith('7')) {
          str = '-7.' + str.substring(1);
        } else if (!isNegatif && str.startsWith('110')) {
          str = '110.' + str.substring(3);
        } else {
          str = (isNegatif ? '-' : '') + str.substring(0, 1) + '.' + str.substring(1);
        }
      }
      return str;
    }

    function escapeHtml(text) { return text.replace(/'/g, "&#039;").replace(/"/g, "&quot;"); }
    function toggleFab() { document.getElementById('fabContainer').classList.toggle('active'); }
    function bukaModalFormPin() { 
      document.getElementById('formTitle').innerText = "📍 Tambah Data Baru"; 
      document.getElementById('inputNama').value = ""; 
      document.getElementById('inputLat').value = map.getCenter().lat.toFixed(6); 
      document.getElementById('inputLng').value = map.getCenter().lng.toFixed(6); 
      document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
      document.getElementById('modal-form').style.display = 'flex'; 
    }
    function tutupModalForm() { document.getElementById('modal-form').style.display = 'none'; }
      
    window.editData = function(nama, lat, lng, kategori, hidden, foto) {
      document.getElementById('formTitle').innerText = "✏️ Edit: " + nama;
      document.getElementById('inputNama').value = nama; document.getElementById('inputLat').value = lat; document.getElementById('inputLng').value = lng;
      document.getElementById('inputPinForm').value = sessionStorage.getItem('verifiedPin') || '';
      var formK = document.getElementById('inputKategori');
      if (kategori === 'kuliner') formK.value = 'Kuliner'; else if (kategori === 'kost') formK.value = 'Kost'; else if (kategori === 'fasum') formK.value = 'Fasum'; else formK.value = 'Rumah';
      document.getElementById('inputHidden').value = hidden ? 'TRUE' : 'FALSE'; document.getElementById('inputFoto').value = foto || '';
      document.getElementById('modal-form').style.display = 'flex';
    };

    function filterKategori(kat, btnElement) {
      document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active')); btnElement.classList.add('active');
      daftarPin.forEach(pin => { map.removeLayer(pin.marker); if (!pin.hidden) { if (kat === 'semua' || pin.kategori === kat) pin.marker.addTo(map); } });
    }

    function cariLokasi() {
      var kataKunci = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!kataKunci) return;

      var hasil = daftarPin.find(pin => pin.namaRaw.toLowerCase() === kataKunci);

      if (!hasil && /^\d+$/.test(kataKunci)) {
        var angkaCari = parseInt(kataKunci, 10);
        hasil = daftarPin.find(pin => {
          var kataKata = pin.nama.split(/[\s,().-]+/);
          return kataKata.some(kata => /^\d+$/.test(kata) && parseInt(kata, 10) === angkaCari);
        });
      }

      if (!hasil && !/^\d+$/.test(kataKunci)) {
        hasil = daftarPin.find(pin => pin.nama.includes(kataKunci));
      }

      if (hasil) {
        if (pinRumahAktif) map.removeLayer(pinRumahAktif);
        if (!map.hasLayer(hasil.marker)) { hasil.marker.addTo(map); pinRumahAktif = hasil.marker; }
        map.flyTo([hasil.lat, hasil.lng], 19); setTimeout(() => { hasil.marker.openPopup(); }, 800);
      } else alert("Lokasi atau nomor rumah tidak ditemukan.");
    }
  </script>
</body>
</html>
