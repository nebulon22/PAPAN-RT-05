<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Denah Interaktif RT 05 Kayen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
    
    .btn-rute {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #00c853;
      color: white !important;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }
    .custom-pin { background: none; border: none; }

    .img-popup {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 6px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .img-popup:hover { opacity: 0.9; }

    #top-panel {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 86%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #search-box {
      background: white;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      gap: 6px;
    }
    #searchInput {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    #search-box button {
      padding: 8px 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    /* Penyesuaian Filter 3 Baris */
    .filter-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-filter {
      flex: 1;
      justify-content: center;
      padding: 6px 12px;
      background: white;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-filter.active {
      background: #00c853;
      color: white;
      border-color: #00c853;
    }

    .btn-info-rt {
      background: #ff9800;
      color: white;
      border-color: #f57c00;
    }

    .badge-count {
      background: #d32f2f;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    .modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 400px;
      max-height: 75vh;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .modal-header h3 { margin: 0; font-size: 16px; color: #111; }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #777; font-weight: bold; }
    .modal-body { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    
    .card-info {
      background: #fdfdfd;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #ff9800;
      padding: 10px 12px;
      border-radius: 6px;
    }
    .card-info .tgl { font-size: 11px; color: #777; font-weight: bold; }
    .card-info .judul { font-size: 14px; font-weight: bold; margin: 4px 0; color: #222; }
    .card-info .detail { font-size: 12.5px; color: #444; margin-bottom: 8px; line-height: 1.4; white-space: pre-line; }
    
    .btn-lihat-lokasi {
      display: inline-block;
      font-size: 11px;
      padding: 6px 10px;
      background: #0288d1;
      color: white;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-foto-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .modal-foto-img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
    }

    /* Tombol Gembok Admin Melayang di Pojok Kanan Atas */
.btn-admin-floating {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 1100; /* Posisi di atas peta & panel filter */
  background: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 16px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  border: 1px solid #ddd;
  transition: transform 0.2s ease, background 0.2s ease;
}

.btn-admin-floating:hover {
  transform: scale(1.1);
  background: #f4f4f4;
}
  </style>
</head>
<body>

<!-- Modal Rekening Koran Per Divisi -->
<div id="modal-keuangan" class="modal-bg" onclick="if(event.target.id==='modal-keuangan') tutupModalKeuangan()">
  <div class="modal-content" style="max-width: 650px;">
    <div class="modal-header">
      <h3>📜 Rekening Koran Divisi</h3>
      <button class="close-btn" onclick="tutupModalKeuangan()">&times;</button>
    </div>
    
    <!-- Pilih Divisi -->
    <div style="margin-bottom: 12px;">
      <label style="font-size:12px; font-weight:bold; color:#555;">Pilih Divisi / Kas:</label>
      <select id="filterDivisi" onchange="tampilkanRekeningKoran()" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; font-weight:bold;">
        <option value="semua">-- Semua Divisi (Total Kas RT) --</option>
      </select>
    </div>

    <!-- Ringkasan Saldo Divisi -->
    <div style="background:#0288d1; color:white; padding:12px; border-radius:8px; text-align:center; margin-bottom:15px;">
      <span style="font-size:11px; text-transform:uppercase; opacity:0.9;">Saldo Saat Ini</span>
      <div id="saldo-kas" style="font-size:22px; font-weight:bold;">Rp 0</div>
    </div>

    <!-- Tabel 2 Kolom (5 Masuk & 5 Keluar) -->
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      
      <!-- Kolom Pemasukan (Hijau) -->
      <div style="flex: 1; min-width: 260px; background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 10px;">
        <h4 style="margin: 0 0 8px 0; color: #2e7d32; font-size: 13px; border-bottom: 2px solid #a5d6a7; padding-bottom: 4px;">
          📥 5 Pemasukan Terakhir
        </h4>
        <table style="width:100%; font-size:11px; border-collapse:collapse;">
          <tbody id="list-pemasukan">
            <tr><td style="text-align:center; padding:10px; color:#888;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Kolom Pengeluaran (Merah) -->
      <div style="flex: 1; min-width: 260px; background: #ffebee; border: 1px solid #ffcdd2; border-radius: 8px; padding: 10px;">
        <h4 style="margin: 0 0 8px 0; color: #c62828; font-size: 13px; border-bottom: 2px solid #ef9a9a; padding-bottom: 4px;">
          📤 5 Pengeluaran Terakhir
        </h4>
        <table style="width:100%; font-size:11px; border-collapse:collapse;">
          <tbody id="list-pengeluaran">
            <tr><td style="text-align:center; padding:10px; color:#888;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

  <!-- Tombol Gembok Admin (Pojok Kanan Atas) -->
  <a href="https://admin.papan05.my.id" target="_blank" class="btn-admin-floating" title="Halaman Admin">🔒</a>


  <!-- 1. Peta diletakkan di luar agar memenuhi seluruh layar (100vh) -->
  <div id="map"></div>

  <!-- 2. Panel pencarian dan filter melayang di atas peta -->
  <div id="top-panel">
    <div id="search-box">
      <input type="text" id="searchInput" placeholder="Cari nama atau No Rumah...">
      <button onclick="cariLokasi()">Cari</button>
    </div>
    
    <!-- Filter 3 Baris -->
    <div class="filter-container">
      <div class="filter-row">
        <button class="btn-filter btn-info-rt" onclick="bukaModalInfo()">
          📢 Info RT <span id="badge-count" class="badge-count" style="display:none;">0</span>
        </button>
        <button class="btn-filter active" onclick="filterKategori('semua', this)">🌍 Semua</button>
      </div>
      <div class="filter-row">
        <button class="btn-filter" onclick="filterKategori('kost', this)">🛏️ Kost</button>
        <button class="btn-filter" onclick="filterKategori('fasum', this)">🏛️ Fasum</button>
      </div>
      <div class="filter-row">
        <button class="btn-filter" onclick="filterKategori('kuliner', this)">🍽️ Kuliner</button>
        <button class="btn-filter" onclick="filterKategori('minimarket', this)">🏪 Minimarket</button>
      </div>
    </div>
  </div>

  <!-- Modal Pengumuman -->
  <div id="modal-info" class="modal-bg" onclick="bukaTutupLuar(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📢 Pengumuman RT 05</h3>
        <button class="close-btn" onclick="tutupModalInfo()">&times;</button>
      </div>
      <div class="modal-body" id="list-pengumuman">
        <p style="text-align:center; color:#888; font-size:13px;">Memuat informasi...</p>
      </div>
    </div>
  </div>



  <!-- Modal Foto Layar Penuh -->
  <div id="modal-foto" class="modal-foto-bg" onclick="tutupFotoBesar(event)">
    <img id="foto-preview" class="modal-foto-img" src="" alt="Pratinjau Foto" onclick="event.stopPropagation()">
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var SHEET_ID = '1zk_ZhczenW5-sZ7B_jvLpzAXEKeyJcxHCTd_qiqbW3Y'; 
    var GID_PENGUMUMAN = '1885853390'; 

    var SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    var PENGUMUMAN_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_PENGUMUMAN}`;

    var map = L.map('map').setView([-7.7423, 110.3842], 17);

    L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
    }).addTo(map);

    var batasRT05 = [
      [-7.7441031, 110.3835], [-7.7447197, 110.3852273], [-7.743848, 110.3854633],
      [-7.7440818, 110.3861822], [-7.742955, 110.3864933], [-7.7428593, 110.3858925],
      [-7.7407331, 110.3866972], [-7.7404886, 110.3861929], [-7.740563, 110.3848089],
      [-7.7399995, 110.3831674], [-7.740159, 110.382234], [-7.7414879, 110.3818906],
      [-7.7421789, 110.3819979], [-7.7428699, 110.3838755], [-7.7441031, 110.3835]
    ];

    L.polygon(batasRT05, { 
      color: '#00c853', 
      weight: 3, 
      fillColor: '#00c853', 
      fillOpacity: 0.1 
    }).addTo(map).bindPopup('<b>Batas Wilayah RT 05 Kayen</b>');

    var daftarPin = [];
    var daftarPengumuman = [];
    var pinRumahAktif = null;

    function parseCSV(text) {
      var lines = text.replace(/\r/g, '').split('\n');
      var result = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        var row = [];
        var inQuotes = false;
        var cur = '';
        for (var c = 0; c < line.length; c++) {
          var char = line[c];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += char;
          }
        }
        row.push(cur.trim().replace(/^"|"$/g, ''));
        result.push(row);
      }
      return result;
    }

    function perbaikiKoordinat(val) {
      if (!val) return "";
      var str = val.toString().replace(/,/g, '.').replace(/\s+/g, '');
      var isNegatif = str.startsWith('-');
      str = str.replace(/-/g, '').replace(/\./g, '');
      
      if (str.length > 2) {
        if (isNegatif && str.startsWith('7')) {
          str = '-7.' + str.substring(1);
        } else if (!isNegatif && str.startsWith('110')) {
          str = '110.' + str.substring(3);
        } else {
          str = (isNegatif ? '-' : '') + str.substring(0, 1) + '.' + str.substring(1);
        }
      }
      return str;
    }

    fetch(SHEET_URL)
      .then(response => response.text())
      .then(csvText => {
        var baris = parseCSV(csvText).slice(1);

        baris.forEach(function(kolom) {
          if (kolom.length >= 3 && kolom[0] !== '') {
            var latClean = perbaikiKoordinat(kolom[1]);
            var lngClean = perbaikiKoordinat(kolom[2]);
            var statusHidden = kolom[3] ? kolom[3].trim().toUpperCase() === 'TRUE' : false;
            var kategoriManual = kolom[4] ? kolom[4].trim().toLowerCase() : '';
            var urlFoto = kolom[5] ? kolom[5].trim() : '';

            var namaAsli = kolom[0].trim();
            var namaTampil = namaAsli;
            
            namaTampil = namaTampil.replace(/\(([^)]+)\)/, function(match, isiKurung) {
              var kataKata = isiKurung.split(' ');
              var hasilSensor = kataKata.map(function(kata) {
                if (kata.length <= 2) return kata;
                return kata.charAt(0) + '*'.repeat(kata.length - 1);
              }).join(' ');
              return '(' + hasilSensor + ')';
            });

            var item = {
              name: namaTampil,
              nameAsli: namaAsli,
              lat: parseFloat(latClean),
              lng: parseFloat(lngClean),
              hidden: statusHidden,
              foto: urlFoto
            };

            if (isNaN(item.lat) || isNaN(item.lng)) return;

            var urlRute = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;
            var htmlFoto = item.foto ? `<br><img src="${item.foto}" class="img-popup" alt="Foto Depan" onclick="bukaFotoBesar('${item.foto}', event)" onError="this.style.display='none'">` : '';
            var popupContent = `<b>${item.name}</b>${htmlFoto}<br><a href="${urlRute}" target="_blank" class="btn-rute">📍 Rute ke Sini</a>`;
            
         // --- Logika Kategori & Ikon Baru ---
let emoji = '🏠'; 
let kategori = 'rumah'; // Default untuk Rumah Warga / RT / RW
let namaUpper = item.nameAsli.toUpperCase();

// Gaya bawaan khusus RUMAH: Latar hijau muda pastel (#dcfce7) & border hijau menyala (#00FF66)
let bgStyle = 'background: #000000; border: 2px solid #00FF66; color: black; width: 22px; height: 22px; font-size: 12px;';

if (kategoriManual.includes('kuliner') || namaUpper.includes('COFFEE') || namaUpper.includes('CAFE') || namaUpper.includes('KEDAI') || namaUpper.includes('WARUNG') || namaUpper.includes('BAKSO') || namaUpper.includes('AYAM') || namaUpper.includes('SOTO')) {
  kategori = 'kuliner'; emoji = '🍽️';
  // Kuliner: Latar coklat muda (#F5E6D3), border biru muda (#38BDF8)
  bgStyle = 'background: #FFA500; border: 2px solid #FFFFFF; color: black; width: 22px; height: 22px; font-size: 12px;';
} 
else if (kategoriManual.includes('minimarket') || kategoriManual.includes('toko') || namaUpper.includes('MART') || namaUpper.includes('TOKO') || namaUpper.includes('LAUNDRY')) {
  kategori = 'minimarket'; emoji = '🏪';
  // Minimarket: Latar putih, border kuning menyala (#FFEA00)
  bgStyle = 'background: #FFFF00; border: 2px solid #FFEA00; color: black; width: 22px; height: 22px; font-size: 12px;';
} 
// --- FITUR KOST & KONTRAKAN (Menggantikan Filter Rumah) ---
else if (kategoriManual.includes('kost') || kategoriManual.includes('kos') || namaUpper.includes('KOST') || namaUpper.includes('KOS') || namaUpper.includes('KONTRAKAN') || namaUpper.includes('WISMA')) {
  kategori = 'kost'; emoji = '🛏️';
  // Kost: Latar ungu muda (#f3e8ff), border ungu (#a855f7)
  bgStyle = 'background: #f3e8ff; border: 2px solid #a855f7; color: black; width: 22px; height: 22px; font-size: 12px;';
}
else if (kategoriManual.includes('fasum') || kategoriManual.includes('umum') || namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || namaUpper.includes('LAPANGAN') || namaUpper.includes('BALAI') || namaUpper.includes('SPORT')) {
  kategori = 'fasum'; emoji = '🏛️';
  // Fasum Umum: Latar putih, border merah
  bgStyle = 'background: white; border: 2px solid #ef4444; color: black; width: 22px; height: 22px; font-size: 12px;';
  
  // Ikon Khusus Masjid (Tetap Teal & Lebih Besar)
  if (namaUpper.includes('MASJID') || namaUpper.includes('MUSHOLA') || kategoriManual.includes('masjid')) {
    emoji = '🕌';
    bgStyle = 'background-color: #0d9488; color: white; border: 2px solid white; width: 28px; height: 28px; font-size: 14px;';
  } else if (namaUpper.includes('LAPANGAN') || namaUpper.includes('SPORT') || namaUpper.includes('BASKETBALL')) {
    emoji = '🏀';
  }
}

// 2. Tambahkan bayangan ganda (box-shadow) agar tercipta efek 2.5D melayang
var customIcon = L.divIcon({
  className: 'custom-pin',
  html: `<div style="${bgStyle} border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 10px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.2);">${emoji}</div>`,
  iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
});
// --- Akhir Logika Ikon ---
            
            var marker = L.marker([item.lat, item.lng], { icon: customIcon }).bindPopup(popupContent, { maxWidth: 220 });
            if (!item.hidden) marker.addTo(map);

            daftarPin.push({ 
              namaRaw: item.nameAsli,
              nama: item.nameAsli.toLowerCase(), 
              marker: marker, 
              lat: item.lat, 
              lng: item.lng,
              hidden: item.hidden,
              kategori: kategori 
            });
          }
        });
      })
      .catch(error => console.error(error));

    fetch(PENGUMUMAN_URL)
      .then(response => response.text())
      .then(csvText => {
        var baris = parseCSV(csvText).slice(1);
        daftarPengumuman = [];

        baris.forEach(function(kolom) {
          if (kolom.length >= 2 && kolom[1] !== '') {
            var status = kolom[4] ? kolom[4].trim().toUpperCase() : 'AKTIF';
            
            if (status === 'AKTIF') {
              daftarPengumuman.push({
                tanggal: kolom[0] || '',
                judul: kolom[1] || '',
                detail: kolom[2] || '',
                lokasi: kolom[3] ? kolom[3].trim() : ''
              });
            }
          }
        });

        var badge = document.getElementById('badge-count');
        if (daftarPengumuman.length > 0) {
          badge.innerText = daftarPengumuman.length;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      })
      .catch(error => console.error("Gagal membaca tab Pengumuman:", error));

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function bukaModalInfo() {
      var container = document.getElementById('list-pengumuman');
      container.innerHTML = '';

      if (daftarPengumuman.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#777; font-size:13px;">Belum ada pengumuman kegiatan terbaru saat ini.</p>';
      } else {
        daftarPengumuman.forEach(function(info) {
          var lokasiParam = encodeURIComponent(info.lokasi);
          var html = `
            <div class="card-info">
              ${info.tanggal ? `<div class="tgl">📅 ${escapeHtml(info.tanggal)}</div>` : ''}
              <div class="judul">${escapeHtml(info.judul)}</div>
              <div class="detail">${escapeHtml(info.detail)}</div>
              ${info.lokasi ? `<button class="btn-lihat-lokasi" onclick="sorotLokasi('${lokasiParam}')">📍 Lihat Lokasi (${escapeHtml(info.lokasi)})</button>` : ''}
            </div>
          `;
          container.innerHTML += html;
        });
      }

      document.getElementById('modal-info').style.display = 'flex';
    }

    function tutupModalInfo() {
      document.getElementById('modal-info').style.display = 'none';
    }

    function bukaTutupLuar(e) {
      if (e.target.id === 'modal-info') tutupModalInfo();
    }

    function sorotLokasi(lokasiEncoded) {
      var namaLokasi = decodeURIComponent(lokasiEncoded).trim();
      tutupModalInfo();

      if (!namaLokasi) return;

      var kataKunci = namaLokasi.toLowerCase();
      var hasil = daftarPin.find(pin => pin.namaRaw.trim().toLowerCase() === kataKunci);

      if (!hasil) {
        hasil = daftarPin.find(pin => pin.nama.includes(kataKunci));
      }

      if (hasil) {
        if (pinRumahAktif) {
          map.removeLayer(pinRumahAktif);
          pinRumahAktif = null;
        }

        if (hasil.hidden || (!map.hasLayer(hasil.marker))) {
          hasil.marker.addTo(map);
          pinRumahAktif = hasil.marker;
        }

        map.flyTo([hasil.lat, hasil.lng], 19);
        setTimeout(() => { hasil.marker.openPopup(); }, 800);
      } else {
        alert("Lokasi '" + namaLokasi + "' tidak ditemukan.\n\nPastikan ejaan lokasi di Sheet Pengumuman (Kolom D) sama persis dengan Nama di Sheet Utama (Kolom A).");
      }
    }

    function filterKategori(kat, btnElement) {
      // Hilangkan status aktif dari tombol selain Info RT
      document.querySelectorAll('.btn-filter:not(.btn-info-rt)').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      daftarPin.forEach(pin => {
        map.removeLayer(pin.marker);

        if (!pin.hidden) {
          if (kat === 'semua') {
            pin.marker.addTo(map);
          } else if (pin.kategori === kat) {
            pin.marker.addTo(map);
          }
        }
      });
    }

    function cariLokasi() {
      var kataKunci = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!kataKunci) return;

      var hasil = null;
      hasil = daftarPin.find(pin => pin.namaRaw.toLowerCase() === kataKunci);

      if (!hasil && /^\d+$/.test(kataKunci)) {
        var angkaCari = parseInt(kataKunci, 10);
        
        hasil = daftarPin.find(pin => {
          var kataKata = pin.nama.split(/[\s,().-]+/);
          return kataKata.some(kata => /^\d+$/.test(kata) && parseInt(kata, 10) === angkaCari);
        });
      }

      if (!hasil && !/^\d+$/.test(kataKunci)) {
        hasil = daftarPin.find(pin => pin.nama.includes(kataKunci));
      }
      
      if (hasil) {
        if (pinRumahAktif) {
          map.removeLayer(pinRumahAktif);
          pinRumahAktif = null;
        }

        if (!map.hasLayer(hasil.marker)) {
          hasil.marker.addTo(map);
          pinRumahAktif = hasil.marker;
        }

        map.flyTo([hasil.lat, hasil.lng], 19);
        setTimeout(() => { hasil.marker.openPopup(); }, 800);
      } else {
        alert("Nomor atau nama tempat tidak ditemukan.");
      }
    }

    function bukaFotoBesar(src, e) {
      if (e) e.stopPropagation();
      var modal = document.getElementById('modal-foto');
      var imgPreview = document.getElementById('foto-preview');
      imgPreview.src = src;
      modal.style.display = 'flex';
    }

    function tutupFotoBesar(e) {
      if (e) {
        e.stopPropagation(); 
        e.preventDefault();
      }
      document.getElementById('modal-foto').style.display = 'none';
    }
	
	var GID_KEUANGAN = '1568425671'; // Ganti GID tab respon Google Form / Sheet keuangan kamu
var KEUANGAN_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_KEUANGAN}`;

var dataKeuangan = [];

function muatDataKeuangan() {
  fetch(KEUANGAN_URL)
    .then(response => response.text())
    .then(csvText => {
      var baris = parseCSV(csvText).slice(1);
      dataKeuangan = [];
      var daftarDivisi = new Set();

      baris.forEach(function(kolom) {
        if (kolom.length >= 5 && (kolom[1] !== '' || kolom[0] !== '')) {
          var tgl = kolom[1] ? kolom[1].trim() : kolom[0].split(' ')[0];
          var divisi = kolom[2] ? kolom[2].trim() : 'Umum';
          var ket = kolom[3] ? kolom[3].trim() : '-';
          
          var tipeRaw = kolom[4] ? kolom[4].trim().toUpperCase() : 'MASUK';
          var tipe = (tipeRaw.includes('KELUAR') || tipeRaw.includes('PENGELUARAN')) ? 'KELUAR' : 'MASUK';
          
          var nominal = parseInt(kolom[5] ? kolom[5].replace(/[^0-9]/g, '') : kolom[4].replace(/[^0-9]/g, '')) || 0;

          if (divisi) daftarDivisi.add(divisi);

          dataKeuangan.push({ tgl, divisi, ket, tipe, nominal });
        }
      });

      // Populate Dropdown Divisi
      var selectDivisi = document.getElementById('filterDivisi');
      var divisiAktif = selectDivisi.value;
      selectDivisi.innerHTML = '<option value="semua">-- Semua Divisi (Total Kas RT) --</option>';
      
      daftarDivisi.forEach(div => {
        selectDivisi.innerHTML += `<option value="${div}">${div}</option>`;
      });
      
      selectDivisi.value = divisiAktif || "semua";

      tampilkanRekeningKoran();
    })
    .catch(err => console.error("Gagal muat data keuangan:", err));
}

function tampilkanRekeningKoran() {
  var divisiTerpilih = document.getElementById('filterDivisi').value;
  
  // Filter data berdasarkan divisi
  var dataFilter = dataKeuangan.filter(item => divisiTerpilih === 'semua' || item.divisi === divisiTerpilih);

  // 1. Hitung Saldo Total Divisi Terpilih
  var totMasuk = 0;
  var totKeluar = 0;

  dataFilter.forEach(item => {
    if (item.tipe === 'MASUK') totMasuk += item.nominal;
    if (item.tipe === 'KELUAR') totKeluar += item.nominal;
  });

  var saldoAkhir = totMasuk - totKeluar;
  document.getElementById('saldo-kas').innerText = 'Rp ' + saldoAkhir.toLocaleString('id-ID');

  // 2. Ambil 5 Pemasukan Terakhir
  var listMasuk = dataFilter.filter(item => item.tipe === 'MASUK').slice(-5).reverse();
  renderTabelKeuangan('list-pemasukan', listMasuk, '#2e7d32', '+');

  // 3. Ambil 5 Pengeluaran Terakhir
  var listKeluar = dataFilter.filter(item => item.tipe === 'KELUAR').slice(-5).reverse();
  renderTabelKeuangan('list-pengeluaran', listKeluar, '#c62828', '-');
}

function renderTabelKeuangan(elementId, dataset, warnaText, tanda) {
  var tbody = document.getElementById(elementId);
  tbody.innerHTML = '';

  if (dataset.length === 0) {
    tbody.innerHTML = '<tr><td style="text-align:center; padding:12px; color:#888;">Belum ada catatan.</td></tr>';
    return;
  }

  dataset.forEach(item => {
    var tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid rgba(0,0,0,0.05)';
    tr.innerHTML = `
      <td style="padding:6px 0;">
        <span style="color:#666; font-size:10px;">${escapeHtml(item.tgl)}</span><br>
        <b>${escapeHtml(item.ket)}</b>
      </td>
      <td style="padding:6px 0; text-align:right; color:${warnaText}; font-weight:bold; white-space:nowrap; vertical-align:top;">
        ${tanda} Rp ${item.nominal.toLocaleString('id-ID')}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function bukaModalKeuangan() {
  document.getElementById('modal-keuangan').style.display = 'flex';
  muatDataKeuangan();
}

function tutupModalKeuangan() {
  document.getElementById('modal-keuangan').style.display = 'none';
}
